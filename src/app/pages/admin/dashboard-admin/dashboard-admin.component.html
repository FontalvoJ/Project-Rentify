<app-navbar-admin></app-navbar-admin>

<app-list-cars-reservations (carCreated)="onCarCreated()">
</app-list-cars-reservations>



<section class="min-h-screen py-6 ">
    <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">

        <!-- Fila métricas -->
        <div class="grid grid-cols-2 gap-3 mb-3 lg:grid-cols-5">

            <!-- Activas -->
            <div
                class="flex items-center gap-3 p-4 transition-shadow duration-200 bg-white border border-gray-100 shadow-sm rounded-xl hover:shadow-md">
                <div class="flex items-center justify-center flex-shrink-0 rounded-lg w-9 h-9 bg-green-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-green-600" width="28.45" height="32"
                        viewBox="0 0 384 432">
                        <path fill="currentColor"
                            d="M341 48q18 0 30.5 12.5T384 91v298q0 18-12.5 30.5T341 432H43q-18 0-30.5-12.5T0 389V91q0-18 12.5-30.5T43 48h89q7-19 23.5-31T192 5t36.5 12T252 48zm-149 0q-9 0-15 6.5t-6 15t6 15t15 6.5t15-6.5t6-15t-6-15t-15-6.5m-43 299l171-171l-30-30l-141 140l-55-55l-30 30z" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-gray-400 other-text">Activas</p>
                    <p class="text-xl font-bold text-gray-900 titles">{{ metrics.active }}</p>
                </div>
            </div>

            <!-- Completadas -->
            <div
                class="flex items-center gap-3 p-4 transition-shadow duration-200 bg-white border border-gray-100 shadow-sm rounded-xl hover:shadow-md">
                <div class="flex items-center justify-center flex-shrink-0 rounded-lg w-9 h-9 bg-blue-50">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-600" width="32" height="32"
                        viewBox="0 0 48 48">
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M4.5 24c0 10.77 8.73 19.5 19.5 19.5S43.5 34.77 43.5 24S34.77 4.5 24 4.5S4.5 13.23 4.5 24M24 47.5C11.021 47.5.5 36.979.5 24S11.021.5 24 .5S47.5 11.021 47.5 24S36.979 47.5 24 47.5m-2.592-36.043c1.157-1.987 4.027-1.987 5.185 0l2.457 4.22a2 2 0 0 0 1.305.948l4.773 1.033c2.247.487 3.134 3.217 1.602 4.931l-3.254 3.642a2 2 0 0 0-.498 1.534l.492 4.858c.231 2.288-2.09 3.975-4.195 3.048l-4.468-1.97a2 2 0 0 0-1.613 0l-4.469 1.97c-2.104.927-4.426-.76-4.194-3.048l.491-4.858a2 2 0 0 0-.498-1.534l-3.254-3.642c-1.532-1.714-.645-4.444 1.602-4.93l4.773-1.034a2 2 0 0 0 1.305-.948z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-gray-400 other-text">Completadas</p>
                    <p class="text-xl font-bold text-gray-900 titles">{{ metrics.completed }}</p>
                </div>
            </div>

            <!-- Pendientes -->
            <div
                class="flex items-center gap-3 p-4 transition-shadow duration-200 bg-white border border-gray-100 shadow-sm rounded-xl hover:shadow-md">
                <div class="flex items-center justify-center flex-shrink-0 rounded-lg w-9 h-9 bg-yellow-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-yellow-600" width="32" height="32"
                        viewBox="0 0 24 24">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 5a2 2 0 0 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6M9 17v1a3 3 0 0 0 6 0v-1m6-10.273A11.05 11.05 0 0 0 18.206 3M3 6.727A11.05 11.05 0 0 1 5.792 3" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-gray-400 other-text">Pendientes</p>
                    <p class="text-xl font-bold text-gray-900 titles">{{ metrics.pending }}</p>
                </div>
            </div>

            <!-- Canceladas -->
            <div
                class="flex items-center gap-3 p-4 transition-shadow duration-200 bg-white border border-gray-100 shadow-sm rounded-xl hover:shadow-md">
                <div class="flex items-center justify-center flex-shrink-0 rounded-lg w-9 h-9 bg-red-50">
                    <svg xmlns="http://www.w3.org/2000/svg"  class="w-4 h-4 text-red-500" width="32" height="32"
                        viewBox="0 0 24 24">
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <path d="M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0m10.584-1.412a2 2 0 0 0 2.828 2.83" />
                            <path d="M5 17H3v-6l2-5h1m4 0h4l4 5h1a2 2 0 0 1 2 2v4m-6 0H9m-6-6h8m4 0h3m-6-3V6M3 3l18 18" />
                        </g>
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-gray-400 other-text">Canceladas</p>
                    <p class="text-xl font-bold text-gray-900 titles">{{ metrics.cancelled }}</p>
                </div>
            </div>

            <!-- Ingresos -->
            <div
                class="flex items-center col-span-2 gap-3 p-4 transition-shadow duration-200 bg-white border border-gray-100 shadow-sm rounded-xl hover:shadow-md lg:col-span-1">
                <div class="flex items-center justify-center flex-shrink-0 rounded-lg w-9 h-9 bg-purple-50">
        
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-purple-600" width="32" height="32"
                        viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M4 22q-.825 0-1.412-.587T2 20V4q0-.825.588-1.412T4 2h16q.825 0 1.413.588T22 4v8h-2.7l-1.95-5.7q-.125-.35-.413-.575T16.3 5.5H7.7q-.35 0-.638.225T6.65 6.3L5 11.1v6.6q0 .35.225.575t.575.225h.4q.35 0 .575-.225T7 17.7v-1.2h2V22zm9 0q-.825 0-1.412-.587T11 20v-4q0-.825.588-1.412T13 14h8q.825 0 1.413.588T23 16v4q0 .825-.587 1.413T21 22zm.925-1.5h6.15q.125-.525.513-.913t.912-.512v-2.15q-.525-.125-.913-.513t-.512-.912h-6.15q-.125.525-.513.913t-.912.512v2.15q.525.125.913.513t.512.912m3.075-1q-.625 0-1.062-.437T15.5 18t.438-1.062T17 16.5t1.063.438T18.5 18t-.437 1.063T17 19.5M9 14q-.425 0-.712-.288T8 13t.288-.712T9 12t.713.288T10 13t-.288.713T9 14M7.65 9.5l.7-2h7.3l.7 2z" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs other-text">Ingresos totales</p>
                    <p class="text-xl font-bold text-gray-900 titles">${{ totalRevenue.toFixed(2) }}</p>
                </div>
            </div>

        </div>
    </div>
    <app-details-cards></app-details-cards>
</section>
