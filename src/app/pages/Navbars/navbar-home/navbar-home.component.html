<div class="relative py-4 bg-white shadow-sm">
    <nav aria-label="Primary navigation">
        <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                
                <div class="flex-shrink-0">
                    <a class="text-4xl title-navbar text-zinc-900" routerLink="/home" aria-label="Logo">
                        Rentify
                    </a>
                </div>

                
                <button class="relative z-20 w-10 h-10 lg:hidden focus:outline-none" type="button" id="hamburger"
                    aria-label="Toggle menu" [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()">
                    <span class="sr-only">Open main menu</span>
                    <div class="absolute block w-5 transform -translate-x-1/2 -translate-y-1/2 left-1/2 top-1/2">
                        <span [ngClass]="{'rotate-45': isMenuOpen, '-translate-y-1.5': !isMenuOpen}"
                            class="block absolute h-0.5 w-5 bg-current transform transition duration-300 ease-in-out"></span>
                        <span [ngClass]="{'opacity-0': isMenuOpen}"
                            class="block absolute h-0.5 w-5 bg-current transform transition duration-300 ease-in-out"></span>
                        <span [ngClass]="{'-rotate-45': isMenuOpen, 'translate-y-1.5': !isMenuOpen}"
                            class="block absolute h-0.5 w-5 bg-current transform transition duration-300 ease-in-out"></span>
                    </div>
                </button>

                
                <div class="hidden lg:flex lg:items-center lg:justify-between lg:flex-1 lg:ml-8">

                    
                    <div class="flex items-center space-x-8">
                        <a class="px-3 py-2 text-lg font-medium transition-colors duration-200 title-navbar hover:opacity-80"
                            routerLink="/cars-home" routerLinkActive="opacity-100 font-semibold">
                            Autos
                        </a>
                        <a class="px-3 py-2 text-lg font-medium transition-colors duration-200 title-navbar hover:opacity-80"
                            routerLink="/sign-up-users" routerLinkActive="opacity-100 font-semibold">
                            Dashboard
                        </a>
                    </div>

                    
                    <div class="flex-shrink-0">
                        <a routerLink="/sign-in"
                            class="inline-flex items-center px-4 py-2 text-lg transition-all duration-200 border border-gray-900 rounded-lg text-navbar hover:bg-gray-900 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
                            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="9" />
                                <circle cx="12" cy="10" r="3" />
                                <path d="M6.168 18.849a4 4 0 0 1 3.832-2.849h4a4 4 0 0 1 3.834 2.855" />
                            </svg>
                            Iniciar
                        </a>
                    </div>
                </div>

                
                <div [ngClass]="{'translate-x-0': isMenuOpen, 'translate-x-full': !isMenuOpen}"
                    class="fixed inset-y-0 right-0 z-50 w-full transition-transform duration-300 ease-in-out transform bg-white shadow-xl lg:hidden sm:w-80">

                    
                    <div class="flex items-center justify-between p-4 border-b border-gray-200">
                        <span class="text-lg font-semibold text-gray-900 title-navbar">Menu</span>
                        <button (click)="toggleMenu()"
                            class="text-gray-400 rounded-md hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-gray-500"
                            aria-label="Close menu">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    
                    <div class="px-4 py-6 space-y-6">

                       
                        <nav class="space-y-2">
                            <a class="block px-3 py-3 text-lg font-medium text-gray-700 transition-colors duration-200 rounded-md title-navbar hover:text-gray-900 hover:bg-gray-50"
                                routerLink="/cars-home" (click)="toggleMenu()">
                                Autos
                            </a>
                            <a class="block px-3 py-3 text-lg font-medium text-gray-700 transition-colors duration-200 rounded-md title-navbar hover:text-gray-900 hover:bg-gray-50"
                                routerLink="/sign-up-users" (click)="toggleMenu()">
                                Dashboard
                            </a>
                        </nav>

                        
                        <div class="pt-4 border-t border-gray-200">
                            <a routerLink="/sign-in"
                                class="flex items-center justify-center w-full px-4 py-3 text-lg font-medium text-white transition-colors duration-200 bg-gray-900 rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
                                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="12" cy="12" r="9" />
                                    <circle cx="12" cy="10" r="3" />
                                    <path d="M6.168 18.849a4 4 0 0 1 3.832-2.849h4a4 4 0 0 1 3.834 2.855" />
                                </svg>
                                Iniciar Sesión
                            </a>
                        </div>
                    </div>
                </div>

              
                <div *ngIf="isMenuOpen" (click)="toggleMenu()"
                    class="fixed inset-0 z-40 transition-opacity duration-300 bg-gray-600 bg-opacity-75 lg:hidden">
                </div>
            </div>
        </div>
    </nav>
</div>
