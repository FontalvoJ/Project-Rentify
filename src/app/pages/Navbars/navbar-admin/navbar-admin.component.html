<div class="relative py-4 bg-white shadow-sm">
    <nav aria-label="Primary navigation">
        <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">


                <div class="flex-shrink-0">
                    <a class="text-4xl titles text-zinc-900" routerLink="/home" aria-label="Logo">
                        Rentify
                    </a>
                </div>


                <button class="relative z-20 w-10 h-10 lg:hidden focus:outline-none" type="button" id="hamburger"
                    aria-label="Toggle menu" [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()">
                    <span class="sr-only">Open main menu</span>
                    <div class="absolute block w-5 transform -translate-x-1/2 -translate-y-1/2 left-1/2 top-1/2">
                        <span [ngClass]="{'rotate-45': isMenuOpen, '-translate-y-1.5': !isMenuOpen}"
                            class="block absolute h-0.5 w-5 bg-current transform transition duration-300 ease-in-out"></span>
                        <span [ngClass]="{'opacity-0': isMenuOpen}"
                            class="block absolute h-0.5 w-5 bg-current transform transition duration-300 ease-in-out"></span>
                        <span [ngClass]="{'-rotate-45': isMenuOpen, 'translate-y-1.5': !isMenuOpen}"
                            class="block absolute h-0.5 w-5 bg-current transform transition duration-300 ease-in-out"></span>
                    </div>
                </button>


                <div class="hidden lg:flex lg:items-center lg:justify-between lg:flex-1 lg:ml-8">


                    <div class="flex items-center space-x-8">
                        <a class="px-3 py-2 text-lg font-medium details" routerLink="/all-reservations">
                            Reservaciones Activas
                        </a>
                        <a class="px-3 py-2 text-lg font-medium details" routerLink="/dashboard-admin">
                            Autos
                        </a>
                    </div>


                    <div class="flex items-center space-x-4">
                        <span class="text-lg details">
                            Bienvenid@, <span class="titles">{{ name }}</span>!
                        </span>
                        <button (click)="logout()"
                            class="inline-flex items-center px-3 py-2 text-lg border border-gray-300 rounded-md titles hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                            aria-label="Logout">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="6" r="4" />
                                <path
                                    d="M15 13.327A13.6 13.6 0 0 0 12 13c-4.418 0-8 2.015-8 4.5S4 22 12 22c5.687 0 7.331-1.018 7.807-2.5" />
                                <circle cx="18" cy="16" r="4" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="m16.667 14.667l2.666 2.666m0-2.666l-2.666 2.666" />
                            </svg>
                            Cerrar Sesión
                        </button>
                    </div>
                </div>


                <div [ngClass]="{'translate-x-0': isMenuOpen, 'translate-x-full': !isMenuOpen}"
                    class="fixed inset-y-0 right-0 z-50 w-full transition-transform duration-300 ease-in-out transform bg-white shadow-xl lg:hidden sm:w-80">


                    <div class="flex items-center justify-between p-4 border-b border-gray-200">
                        <span class="text-lg titles">Menu</span>
                        <button (click)="toggleMenu()"
                            class="text-gray-400 rounded-md hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            aria-label="Close menu">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>


                    <div class="px-4 py-6 space-y-6">

                        <div class="pb-4 border-b border-gray-200">
                            <p class="text-sm details">Bienvenid@,</p>
                            <p class="text-lg titles">{{ name }}!</p>
                        </div>


                        <nav class="space-y-2">
                            <a class="block px-3 py-2 text-gray-700 transition-colors duration-200 rounded-md details hover:text-gray-900 hover:bg-gray-50"
                                routerLink="/all-reservations" (click)="toggleMenu()">
                                Reservaciones Activas
                            </a>
                            <a class="block px-3 py-2 text-gray-700 transition-colors duration-200 rounded-md details hover:text-gray-900 hover:bg-gray-50"
                                routerLink="/dashboard-admin" (click)="toggleMenu()">
                                Autos
                            </a>
                        </nav>


                        <div class="pt-4 border-t border-gray-200">
                            <button (click)="logout()"
                                class="flex items-center justify-center w-full px-4 py-2 transition-colors duration-200 bg-white border border-gray-300 rounded-md titles hover:bg-gray-50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="6" r="4" />
                                    <path
                                        d="M15 13.327A13.6 13.6 0 0 0 12 13c-4.418 0-8 2.015-8 4.5S4 22 12 22c5.687 0 7.331-1.018 7.807-2.5" />
                                    <circle cx="18" cy="16" r="4" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m16.667 14.667l2.666 2.666m0-2.666l-2.666 2.666" />
                                </svg>
                                Cerrar Sesión
                            </button>
                        </div>
                    </div>
                </div>


                <div *ngIf="isMenuOpen" (click)="toggleMenu()"
                    class="fixed inset-0 z-40 transition-opacity duration-300 bg-gray-600 bg-opacity-75 lg:hidden">
                </div>
            </div>
        </div>
    </nav>
</div>
