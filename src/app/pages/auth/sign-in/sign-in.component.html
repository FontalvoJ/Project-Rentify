<app-navbar-home></app-navbar-home>

<section class="flex items-center justify-center py-16">
    <div class="w-full px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">

        <!-- Hero Section -->
        <div class="mb-10 text-center">
            <h2 class="text-3xl font-bold leading-tight md:text-4xl titles">
                ¡Inicia sesión ahora y vive la diferencia!
            </h2>
            <p class="max-w-xl mx-auto mt-3 text-base leading-relaxed text-gray-600 other-text">
                Disfruta del mejor servicio de alquiler del sector — tu próxima aventura comienza con nosotros.
            </p>
        </div>

        <!-- Login Card -->
        <div class="max-w-md mx-auto">
            <div class="overflow-hidden bg-white border border-gray-100 shadow-sm rounded-2xl">

                <!-- Card Header -->
                <div class="px-8 py-5 bg-black">
                    <p class="text-sm text-center text-gray-300 titles">
                        Ingresa tus credenciales para continuar
                    </p>
                </div>

                <!-- Form Content -->
                <div class="p-6 sm:p-8 bg-gray-50">
                    <form class="space-y-5" (ngSubmit)="signIn()" #signinForm="ngForm">

                        <!-- Email Field -->
                        <div class="space-y-1.5">
                            <label for="email" class="block text-sm font-semibold text-gray-700 other-text">
                                Correo Electrónico
                            </label>
                            <div class="relative">
                                <input type="email" id="email" name="email" required [(ngModel)]="credentials.email"
                                    class="w-full px-4 py-2.5 pr-12 text-sm text-gray-900 placeholder-gray-400 transition-all bg-white border border-gray-300 rounded-lg details focus:border-black focus:ring-2 focus:ring-black/20"
                                    placeholder="usuario@ejemplo.com">
                                <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400"
                                        viewBox="0 0 36 36">
                                        <path fill="currentColor"
                                            d="M32 6H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h28a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2m-1.54 22H5.66l7-7.24l-1.44-1.39L4 26.84V9.52l12.43 12.37a2 2 0 0 0 2.82 0L32 9.21v17.5l-7.36-7.36l-1.41 1.41ZM5.31 8h25.07L17.84 20.47Z" />
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="space-y-1.5">
                            <label for="password" class="block text-sm font-semibold text-gray-700 other-text">
                                Contraseña
                            </label>
                            <div class="relative">
                                <input type="password" id="password" name="password" required
                                    [(ngModel)]="credentials.password"
                                    class="w-full px-4 py-2.5 pr-12 text-sm text-gray-900 placeholder-gray-400 transition-all bg-white border border-gray-300 rounded-lg details focus:border-black focus:ring-2 focus:ring-black/20"
                                    placeholder="••••••••">
                                <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400"
                                        viewBox="0 0 24 24">
                                        <path fill="currentColor"
                                            d="M2.5 18.5v-1h19v1zm.535-5.973l-.762-.442l.965-1.693h-1.93v-.884h1.93l-.965-1.642l.762-.443L4 9.066l.966-1.643l.761.443l-.965 1.642h1.93v.884h-1.93l.965 1.693l-.762.442L4 10.835zm8 0l-.762-.442l.966-1.693H9.308v-.884h1.93l-.965-1.642l.762-.443L12 9.066l.966-1.643l.761.443l-.965 1.642h1.93v.884h-1.93l.965 1.693l-.762.442L12 10.835zm8 0l-.762-.442l.966-1.693h-1.931v-.884h1.93l-.965-1.642l.762-.443L20 9.066l.966-1.643l.761.443l-.965 1.642h1.93v.884h-1.93l.965 1.693l-.762.442L20 10.835z" />
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div *ngIf="errorMessage" class="flex items-start gap-2.5 px-4 py-3 text-sm rounded-lg border"
                            [ngClass]="{
                                'bg-red-50 border-red-200 text-red-700': !blocked,
                                'bg-amber-50 border-amber-200 text-amber-700': blocked
                            }">

                            <!-- Ícono credenciales incorrectas -->
                            <svg *ngIf="!blocked" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mt-0.5 shrink-0"
                                viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                            </svg>

                            <!-- Ícono bloqueado -->
                            <svg *ngIf="blocked" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mt-0.5 shrink-0"
                                viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="M12 1C8.676 1 6 3.676 6 7v1H4v15h16V8h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v1H8V7c0-2.276 1.724-4 4-4zm0 9a2 2 0 0 1 2 2a2 2 0 0 1-2 2a2 2 0 0 1-2-2a2 2 0 0 1 2-2z" />
                            </svg>

                            <span class="leading-snug titles">{{ errorMessage }}</span>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" [disabled]="signinForm.invalid || loading || blocked"
                            class="flex items-center justify-center w-full gap-2 py-3 text-sm font-semibold text-white transition-all bg-black rounded-lg shadow-md titles hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg">

                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2">
                                    <path d="M20 12a8 8 0 0 0-8-8m0 16a7.99 7.99 0 0 0 6.245-3" />
                                    <path stroke-linejoin="round" d="M4 12h10m0 0l-3-3m3 3l-3 3" />
                                </g>
                            </svg>

                            <span *ngIf="!blocked && !loading">Iniciar Sesión</span>
                            <span *ngIf="loading">Cargando...</span>
                            <span *ngIf="blocked">Intenta en {{ countdown }}s</span>

                        </button>

                    </form>
                </div>
            </div>
        </div>

        <!-- Trust Indicators -->
        <div class="flex flex-wrap items-center justify-center gap-6 mt-8 other-text">
            <div class="flex items-center gap-1.5 text-gray-500">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5z" />
                </svg>
                <span class="text-xs">Conexión segura</span>
            </div>
            <div class="flex items-center gap-1.5 text-gray-500">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                </svg>
                <span class="text-xs">Datos protegidos</span>
            </div>
            <div class="flex items-center gap-1.5 text-gray-500">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                </svg>
                <span class="text-xs">Soporte 24/7</span>
            </div>
        </div>

    </div>
</section>
