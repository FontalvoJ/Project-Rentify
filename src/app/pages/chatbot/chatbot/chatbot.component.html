<!-- 
  RENTIFY CHATBOT - UI PREMIUM
  Diseño elegante que combina con la estética de Rentify
  Colores: Negro, Dorado, Blanco
-->

<!-- Botón flotante con animación -->
<button (click)="toggleChat()"
    class="fixed z-50 flex items-center justify-center w-16 h-16 text-2xl text-white transition-all duration-300 transform bg-black border-2 border-yellow-500 rounded-full shadow-2xl bottom-6 right-6 hover:scale-110 hover:bg-gray-900 hover:shadow-yellow-500/50">
    <span *ngIf="!isOpen">🚗</span>
    <span *ngIf="isOpen">✕</span>
</button>

<!-- Ventana del chat -->
<div *ngIf="isOpen"
    class="fixed bottom-24 right-6 w-96 h-[500px] bg-white rounded-2xl shadow-2xl flex flex-col z-50 border-2 border-gray-200 overflow-hidden">

    <!-- Header Premium -->
    <div
        class="relative flex items-center justify-between p-4 text-white bg-gradient-to-r from-gray-900 via-black to-gray-900">
        <!-- Logo y título -->
        <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-10 h-10 bg-yellow-500 rounded-full">
                <span class="text-xl">🚗</span>
            </div>
            <div>
                <h3 class="text-lg font-bold">Rentify Bot</h3>
                <p class="text-xs text-yellow-400">Asistente Virtual Premium</p>
            </div>
        </div>

        <!-- Botón cerrar -->
        <button (click)="toggleChat()"
            class="flex items-center justify-center w-8 h-8 text-white transition-all duration-200 rounded-full hover:bg-white/20">
            <span class="text-xl">✕</span>
        </button>
    </div>

    <!-- Área de mensajes con scroll suave -->
    <div #messagesContainer (scroll)="onScroll()"
        class="flex-1 p-4 space-y-3 overflow-y-auto bg-gradient-to-b from-gray-50 to-white chat-messages">

        <div *ngFor="let msg of messages" class="animate-fadeIn">

            <!-- Mensaje del Bot -->
            <div *ngIf="msg.from === 'bot'" class="flex gap-2 mb-3">
                <!-- Avatar del bot -->
                <div class="flex items-start flex-shrink-0">
                    <div class="flex items-center justify-center w-8 h-8 text-sm bg-yellow-500 rounded-full">
                        🤖
                    </div>
                </div>

                <!-- Burbuja del bot -->
                <div
                    class="bg-white text-gray-800 p-3 rounded-2xl rounded-tl-none shadow-md max-w-[75%] border border-gray-200">
                    <p class="text-sm leading-relaxed whitespace-pre-line">{{ msg.text }}</p>
                    <span class="block mt-1 text-xs text-gray-400">{{ msg.time }}</span>
                </div>
            </div>

            <!-- Mensaje del Usuario -->
            <div *ngIf="msg.from === 'user'" class="flex justify-end gap-2 mb-3">
                <!-- Burbuja del usuario -->
                <div
                    class="bg-gradient-to-r from-gray-900 to-black text-white p-3 rounded-2xl rounded-tr-none shadow-md max-w-[75%]">
                    <p class="text-sm leading-relaxed">{{ msg.text }}</p>
                    <span class="block mt-1 text-xs text-yellow-400">{{ msg.time }}</span>
                </div>

                <!-- Avatar del usuario -->
                <div class="flex items-start flex-shrink-0">
                    <div class="flex items-center justify-center w-8 h-8 text-sm text-white bg-gray-700 rounded-full">
                        👤
                    </div>
                </div>
            </div>

        </div>

        <!-- Indicador de escritura -->
        <div *ngIf="isTyping" class="flex gap-2 mb-3">
            <div class="flex items-center justify-center w-8 h-8 text-sm bg-yellow-500 rounded-full">
                🤖
            </div>
            <div class="flex items-center gap-1 p-3 bg-white border border-gray-200 rounded-2xl">
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
            </div>
        </div>

    </div>

    <!-- Sugerencias rápidas -->
    <div class="px-4 py-2 border-t border-gray-200 bg-gray-50" *ngIf="showSuggestions && !isTyping">
        <div class="flex gap-2 overflow-x-auto">
            <button (click)="sendQuickMessage('Ver autos')"
                class="px-3 py-1 text-xs text-gray-700 transition-all duration-200 bg-white border border-gray-300 rounded-full whitespace-nowrap hover:bg-yellow-500 hover:text-white hover:border-yellow-500">
                🚗 Ver autos
            </button>
            <button (click)="sendQuickMessage('Promociones')"
                class="px-3 py-1 text-xs text-gray-700 transition-all duration-200 bg-white border border-gray-300 rounded-full whitespace-nowrap hover:bg-yellow-500 hover:text-white hover:border-yellow-500">
                🎁 Promociones
            </button>
            <button (click)="sendQuickMessage('Ayuda')"
                class="px-3 py-1 text-xs text-gray-700 transition-all duration-200 bg-white border border-gray-300 rounded-full whitespace-nowrap hover:bg-yellow-500 hover:text-white hover:border-yellow-500">
                ❓ Ayuda
            </button>
        </div>
    </div>

    <!-- Input área -->
    <div class="flex gap-2 p-4 bg-white border-t-2 border-gray-200">
        <input [(ngModel)]="userMessage" (keyup.enter)="sendMessage()" type="text" placeholder="Escribe tu mensaje..."
            [disabled]="isTyping"
            class="flex-1 px-4 py-3 text-sm text-gray-800 transition-all duration-200 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20 disabled:opacity-50 disabled:cursor-not-allowed" />

        <button (click)="sendMessage()" [disabled]="!userMessage.trim() || isTyping"
            class="flex items-center justify-center w-12 h-12 text-white transition-all duration-200 transform bg-gradient-to-r from-yellow-500 to-yellow-600 rounded-xl hover:scale-105 hover:shadow-lg hover:shadow-yellow-500/50 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
            <span class="text-xl">➤</span>
        </button>
    </div>

    <!-- Footer con branding -->
    <div class="py-2 text-center bg-gray-50">
        <p class="text-xs text-gray-500">
            Powered by <span class="font-semibold text-yellow-600">Rentify</span>
            <span class="text-yellow-500">✨</span>
        </p>
    </div>

</div>
